<h2>Configurează perioada permisă pentru programarea examenelor</h2>

<form method="post" action="/secretariat/limite-examene">
    <label>Data început:</label>
    <input type="datetime-local" name="data_inceput" value="{{ limite.data_inceput.strftime('%Y-%m-%dT%H:%M') if limite else '' }}" required><br><br>

    <label>Data sfârșit:</label>
    <input type="datetime-local" name="data_sfarsit" value="{{ limite.data_sfarsit.strftime('%Y-%m-%dT%H:%M') if limite else '' }}" required><br><br>

    <button type="submit">💾 Salvează</button>
</form>
