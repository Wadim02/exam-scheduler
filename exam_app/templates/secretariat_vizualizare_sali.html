<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Vizualizare Săli</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        input[type="text"] { width: 100%; box-sizing: border-box; }
        .sticky-save {
            position: sticky;
            top: 0;
            background: #fff;
            padding: 10px 0;
            border-bottom: 2px solid #ddd;
            z-index: 10;
        }
        .delete-form {
            display: inline;
        }
    </style>
</head>
<body>
    <h1>📋 Vizualizare și Editare Săli</h1>
<h2>➕ Adaugă sală nouă</h2>
    <form method="post" action="/secretariat/sali/add">
        <label>Nume:</label>
        <input type="text" name="name" required>
        <label>ShortName:</label>
        <input type="text" name="shortName">
        <label>Clădire:</label>
        <input type="text" name="buildingName">
        <button type="submit">➕ Adaugă</button>
    </form>
    <form method="post" action="/secretariat/sali/update">
        <div class="sticky-save">
            <button type="submit">💾 Salvează toate modificările</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nume</th>
                    <th>ShortName</th>
                    <th>Clădire</th>
                    <th>Acțiuni</th>
                </tr>
            </thead>
            <tbody>
    {% for sala in sali %}
    <tr>
        <!-- Form principal pentru salvare -->
        <form method="post" action="/secretariat/sali/update">
            <td>
                {{ sala.id }}
                <input type="hidden" name="id" value="{{ sala.id }}">
            </td>
            <td><input type="text" name="name" value="{{ sala.name }}"></td>
            <td><input type="text" name="shortName" value="{{ sala.shortName }}"></td>
            <td><input type="text" name="buildingName" value="{{ sala.buildingName }}"></td>
            <td>
                <button type="submit">💾 Salvează</button>
            
        </form>

        <!-- Form separat pentru ștergere -->
        
            <form method="post" action="/secretariat/sali/delete/{{ sala.id }}" onsubmit="return confirm('Sigur vrei să ștergi această sală?');">
                <button type="submit">🗑️</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</tbody>
        </table>

        <br>
        <button type="submit">💾 Salvează toate modificările</button>
    </form>

    <hr>


    <br><a href="/secretariat">⬅ Înapoi la dashboard</a>
</body>
</html>
