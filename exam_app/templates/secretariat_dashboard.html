<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Secretariat</title>
</head>
<body>
    <h2>Gestionare Săli</h2>

    <!-- Descărcare săli -->
    <button onclick="downloadSali()">📥 Descarcă sălile</button>
    <div id="progressBar" style="display: none; color: green;">
        <p>Se generează fișierul... Așteaptă.</p>
    </div>
    <br><br>

    <!-- Încărcare fișier Excel -->
    <form action="/secretariat/incarca-sali" method="post" enctype="multipart/form-data">
        <label for="file">Încarcă fișier săli modificat (.xlsx):</label>
        <input type="file" name="file" accept=".xlsx" required>
        <button type="submit">🚀 Încarcă</button>
    </form>
<br><br>
    <script>
        async function downloadSali() {
            const progressBar = document.getElementById("progressBar");
            progressBar.style.display = "block";

            try {
                const response = await fetch("/secretariat/descopera-sali");

                if (!response.ok) {
                    throw new Error("Eroare la descărcare");
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "sali.xlsx";
                document.body.appendChild(link);
                link.click();
                link.remove();
            } catch (err) {
                alert("❌ " + err.message);
            } finally {
                progressBar.style.display = "none";
            }
        }
    </script>
</body>
</html>
