<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calendar Examene</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #calendar {
            max-width: 900px;
            margin: 0 auto;
        }
        .fc-event {
            font-size: 0.9em;
            max-width: 100%;
        }
        .fc-event-title {
            font-size: 0.8em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <h2>Calendar propuneri examene</h2>
    <label for="disciplina">Alege disciplina:</label>
    <select id="disciplina"></select>
    <div id="calendar"></div>

    <script>
        const startLimit = "{{ start_limit }}";
        const endLimit = "{{ end_limit }}";

        document.addEventListener('DOMContentLoaded', async function () {
            if (!startLimit || !endLimit) {
        document.body.innerHTML = `
            <h2>Calendar propuneri examene</h2>
            <p style="color:red; font-weight:bold;">
                ⚠️ Nu poți propune examene deoarece perioada de programare nu a fost configurată de secretariat.
            </p>
        `;
        return;
    }
            const response1 = await fetch('/sefgrupa/discipline');
            const discipline = await response1.json();
            const select = document.getElementById("disciplina");
            discipline.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d.id;
                opt.textContent = d.topic;
                select.appendChild(opt);
            });

            const response2 = await fetch('/sefgrupa/ocupare-calendar');
            const ocupat = await response2.json();

            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                slotMinTime: "08:00:00",
                slotMaxTime: "20:00:00",
                slotDuration: "01:00:00",
                allDaySlot: false,
                selectable: true,
                height: "auto",
                locale: 'ro',
                validRange: {
                    start: startLimit,
                    end: endLimit
                },
                eventContent: function(arg) {
                    return {
                        html: arg.event.title
                    };
                },
                events: ocupat.map(p => {
                    const start = p.data;
                    const end = new Date(new Date(p.data).getTime() + p.durata * 60 * 60 * 1000).toISOString();

                    let scurt = p.disciplina.length > 25 ? p.disciplina.slice(0, 22) + "…" : p.disciplina;
                    let title = `${scurt}<br><strong>${p.status.toUpperCase()}</strong>`;
                    if (p.status === "respinsa" && p.motiv) {
                        title += `<br>Motiv: ${p.motiv}`;
                    }

                    return {
                        title: title,
                        start: start,
                        end: end,
                        color: p.status === "acceptata" ? "green" :
                               p.status === "respinsa" ? "red" : "orange",
                        extendedProps: {
                            motiv: p.motiv,
                            disciplina: p.disciplina
                        }
                    };
                }),
                select: async function (info) {
                    const disciplinaId = document.getElementById("disciplina").value;
                    const data = info.startStr;

                    const start = new Date(data);
                    const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);

                    if (end.getHours() > 20 || (end.getHours() === 20 && end.getMinutes() > 0)) {
                        alert("Examenul nu poate depăși ora 20:00. Alege o oră de început mai devreme.");
                        return;
                    }

                    const confirmare = confirm(`Propui examen pe ${data} pentru 2 ore?`);
                    if (confirmare) {
                        const r = await fetch("/sefgrupa/propunere", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                disciplina_id: parseInt(disciplinaId),
                                data: data,
                                durata: 2
                            })
                        });

                        if (r.ok) {
                            alert("Propunere trimisă!");
                            window.location.reload();
                        } else {
                            let errMsg;
                            try {
                                const err = await r.json();
                                if (Array.isArray(err.detail)) {
                                    errMsg = err.detail.map(e => `• ${e.loc.join(" → ")}: ${e.msg}`).join("\n");
                                } else {
                                    errMsg = err.detail || JSON.stringify(err);
                                }
                            } catch (e) {
                                errMsg = await r.text();
                            }
                            alert("Eroare:\n" + errMsg);
                        }
                    }
                }
            });

            calendar.render();

            calendar.on('eventDidMount', function(info) {
                const disciplina = info.event.extendedProps.disciplina || "Disciplina necunoscută";
                const motiv = info.event.extendedProps.motiv;

                let tooltip = `${disciplina} – ${info.event.title}`;
                if (motiv) tooltip += `\nMotiv: ${motiv}`;

                info.el.setAttribute("title", tooltip);
            });
        });
    </script>
</body>
</html>
