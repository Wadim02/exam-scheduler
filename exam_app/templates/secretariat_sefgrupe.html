<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Gestionare Șefi de Grupă</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 1em; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        input[type="text"], select { width: 100%; box-sizing: border-box; }
        form.inline { display: inline; margin: 0; }
        h1, h2 { margin-top: 1em; }
    </style>
</head>
<body>
    <h1>👤 Șefi de grupă</h1>
    {% if error_message %}
        <div style="color: red; font-weight: bold;">{{ error_message }}</div>
    {% endif %}
    {% if success_message %}
        <div style="color: green; font-weight: bold;">{{ success_message }}</div>
    {% endif %}

    <h2>➕ Adaugă șef nou</h2>
    <form method="post" action="/secretariat/sefgrupe/add">
        <label>Nume:</label>
        <input type="text" name="lastName" required>
        <label>Prenume:</label>
        <input type="text" name="firstName" required>
        <label>Email:</label>
        <input type="text" name="emailAddress" required>
        <label>Telefon:</label>
        <input type="text" name="phoneNumber">
        <label>Facultate:</label>
        <select name="id_facultate">
            {% for f in facultati %}
            <option value="{{ f.id }}">{{ f.shortName }} - {{ f.longName }}</option>
            {% endfor %}
        </select>
        <label>Subgrupă:</label>
        <select name="id_subgrupe">
            {% for s in subgrupe %}
            <option value="{{ s.id }}">{{ s.studyYear }} - {{ s.groupName }}{{ s.subgroupIndex }}</option>
            {% endfor %}
        </select>
        <button type="submit">➕ Adaugă</button>
    </form>

    <h2>📋 Șefi existenți</h2>
    <table>
        <thead>
            <tr>
                <th>Nume</th>
                <th>Prenume</th>
                <th>Email</th>
                <th>Telefon</th>
                <th>Facultate</th>
                <th>Subgrupă</th>
                <th>Acțiuni</th>
            </tr>
        </thead>
        <tbody>
            {% for sef in sefi %}
            <tr>
                <form method="post" action="/secretariat/sefgrupe/update" class="inline">
    <td><input type="text" name="lastName_{{ sef.id }}" value="{{ sef.lastName }}"></td>
    <td><input type="text" name="firstName_{{ sef.id }}" value="{{ sef.firstName }}"></td>
    <td><input type="text" name="emailAddress_{{ sef.id }}" value="{{ sef.emailAddress }}"></td>
    <td><input type="text" name="phoneNumber_{{ sef.id }}" value="{{ sef.phoneNumber }}"></td>
    <td>
        <select name="id_facultate_{{ sef.id }}">
            {% for f in facultati %}
            <option value="{{ f.id }}" {% if f.id == sef.id_facultate %}selected{% endif %}>{{ f.shortName }}</option>
            {% endfor %}
        </select>
    </td>
    <td>
        <select name="id_subgrupe_{{ sef.id }}">
            {% for s in subgrupe %}
            <option value="{{ s.id }}" {% if s.id == sef.id_subgrupe %}selected{% endif %}>{{ s.studyYear }} - {{ s.groupName }}{{ s.subgroupIndex }}</option>
            {% endfor %}
        </select>
    </td>
    <td>
        <input type="hidden" name="id" value="{{ sef.id }}">
        <button type="submit">💾 Salvează</button>
    </td>
</form>
                <td>
                    <form method="post" action="/secretariat/sefgrupe/delete/{{ sef.id }}" class="inline" onsubmit="return confirm('Sigur vrei să ștergi acest șef de grupă?');">
                        <button type="submit">🗑️ Șterge</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br><a href="/secretariat">⬅ Înapoi la dashboard</a>
</body>
</html>
