<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Administrare Secretariat</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }
        form { display: inline-block; margin: 0 5px; }
    </style>
</head>
<body>
<h2>Administrare Secretari</h2>
<h3>Adaugă secretar nou</h3>
<form action="/admin/secretariat/add" method="post">
    <input type="text" name="firstName" placeholder="Prenume" required>
    <input type="text" name="lastName" placeholder="Nume" required>
    <input type="email" name="emailAddress" placeholder="Email" required>
    <input type="text" name="facultyName" placeholder="Facultate" required>
    <input type="text" name="departmentName" placeholder="Departament" required>
    <button type="submit">Adaugă</button>
</form>

<h3>Secretari existenți</h3>
<table>
    <tr>
        <th>ID</th>
        <th>Nume</th>
        <th>Email</th>
        <th>Facultate</th>
        <th>Departament</th>
        <th>Acțiuni</th>
    </tr>
    {% for s in secretari %}
    <tr>
        <form action="/admin/secretariat/update" method="post">
            <td>{{ s.id }}<input type="hidden" name="id" value="{{ s.id }}"></td>
            <td>
                <input type="text" name="firstName" value="{{ s.firstName }}" required>
                <input type="text" name="lastName" value="{{ s.lastName }}" required>
            </td>
            <td><input type="email" name="emailAddress" value="{{ s.emailAddress }}" required></td>
            <td><input type="text" name="facultyName" value="{{ s.facultyName }}" required></td>
            <td><input type="text" name="departmentName" value="{{ s.departmentName }}" required></td>
            <td>
                <button type="submit">Salvează</button>
        </form>
        <form action="/admin/secretariat/delete" method="post">
            <input type="hidden" name="id" value="{{ s.id }}">
            <button type="submit">Șterge</button>
        </form>
            </td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
