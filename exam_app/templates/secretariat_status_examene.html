<!-- templates/secretariat_status_examene.html -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Status examene</title>
</head>
<body>
<h2>📊 Situație completare examene</h2>
<p id="rezumatExamene"></p>
<a href="/secretariat/examene">
    <button>✏️ Modifică examenele programate</button>
</a>
<div>
    <button onclick="schimbaPagina(-1)">⬅️ Înapoi</button>
    <span id="paginaCurenta">Pagina 1</span>
    <button onclick="schimbaPagina(1)">➡️ Înainte</button>
</div>
<div style="margin-top: 10px;">
    <label for="paginaInput">📄 Du-te la pagina:</label>
    <input type="number" id="paginaInput" min="1" style="width: 60px;">
    <button onclick="mergiLaPagina()">🔁 Salt</button>
</div>
<table border="1" id="tabelExamene">
    <thead>
        <tr>
            <th>ID</th>
            <th>Cadru</th>
            <th>Subgrupa</th>
            <th>Disciplina</th>
            <th>Stare</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<script>
    let pagina = 1;
function mergiLaPagina() {
    const input = document.getElementById("paginaInput");
    const valoare = parseInt(input.value);
    if (!isNaN(valoare) && valoare >= 1) {
        pagina = valoare;
        incarcaStatusExamene();
    }
}


async function incarcaStatusExamene() {
    const tabel = document.querySelector("#tabelExamene tbody");
    const rezumat = document.getElementById("rezumatExamene");
    const paginaSpan = document.getElementById("paginaCurenta");

    tabel.innerHTML = "<tr><td colspan='5'>⏳ Se încarcă...</td></tr>";
    rezumat.innerText = "";

    try {
        const r = await fetch(`/secretariat/status-examene?page=${pagina}&size=50`);
        const data = await r.json();

        const total = data.total;
        const completate = data.programate;
        const procent = ((completate / total) * 100).toFixed(1);

        rezumat.innerText = `✅ ${completate} din ${total} discipline au examen programat (${procent}%)`;
        paginaSpan.innerText = `Pagina ${data.pagina} din ${data.total_pagini}`;

        tabel.innerHTML = "";
        data.discipline.forEach(d => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${d.id}</td>
                <td>${d.cadru}</td>
                <td>${d.subgrupa}</td>
                <td>${d.disciplina}</td>
                <td style="font-weight: bold; color: ${d.stare === "programat" ? "green" : "red"}">
                    ${d.stare}
                </td>
            `;
            if (d.stare === "neprogramat") {
                tr.style.backgroundColor = "#ffe0e0";
            }
            tabel.appendChild(tr);
        });
    } catch (err) {
        rezumat.innerText = "❌ Eroare la încărcare";
        tabel.innerHTML = `<tr><td colspan="5" style="color:red">❌ ${err.message}</td></tr>`;
    }
}

function schimbaPagina(delta) {
    pagina += delta;
    if (pagina < 1) pagina = 1;
    incarcaStatusExamene();
}

window.onload = incarcaStatusExamene;
</script>
</body>
</html>
