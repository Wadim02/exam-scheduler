<!-- templates/secretariat_examen_edit.html -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Editare Examen</title>
</head>
<body>
<h2>✏️ Editează Examen</h2>
{% if mesaj_eroare %}
    <p style="color:red; font-weight:bold;">❌ {{ mesaj_eroare }}</p>
{% endif %}
<form method="post">
    <p><strong>Disciplina:</strong> {{ examen.disciplina.topic }}</p>
    <p><strong>Titular:</strong> {{ examen.disciplina.cadru.firstName }} {{ examen.disciplina.cadru.lastName }}</p>

    <label for="data">Data examenului:</label>
    <input type="datetime-local" id="data" name="data" value="{{ examen.data.strftime('%Y-%m-%dT%H:%M') }}" required><br><br>

    <label for="durata">Durata (ore):</label>
    <input type="number" id="durata" name="durata" value="{{ examen.durata }}" required><br><br>

    <label for="id_sala">Sala:</label>
    <select name="id_sala" id="id_sala" required>
        {% for sala in sali %}
            <option value="{{ sala.id }}" {% if sala.id == examen.id_sala %}selected{% endif %}>{{ sala.name }}</option>
        {% endfor %}
    </select><br><br>

    <label for="id_asistent">Asistent (opțional):</label>
    <select name="id_asistent" id="id_asistent">
        <option value="">-- Fără asistent --</option>
        {% for cadru in asistenti %}
            <option value="{{ cadru.id }}" {% if examen.id_asistent == cadru.id %}selected{% endif %}>
                {{ cadru.firstName }} {{ cadru.lastName }}
            </option>
        {% endfor %}
    </select><br><br>

    <button type="submit">💾 Salvează</button>
    <a href="/secretariat/examene"><button type="button">↩️ Înapoi</button></a>
</form>
<script>
async function incarcaSaliDisponibile() {
    const data = document.getElementById("data").value;
    const durata = document.getElementById("durata").value;
    const examenId = Number("{{ examen.id }}");
    const selectSala = document.getElementById("id_sala");

    if (!data || !durata) return;

    const r = await fetch(`/secretariat/sali-disponibile?data=${encodeURIComponent(data)}&durata=${durata}&examen_id=${examenId}`);
    const sali = await r.json();

    selectSala.innerHTML = "";

    if (sali.length === 0) {
        const opt = document.createElement("option");
        opt.textContent = "❌ Nicio sală disponibilă";
        selectSala.appendChild(opt);
        return;
    }

    sali.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.nume;
        selectSala.appendChild(opt);
    });
}

document.getElementById("data").addEventListener("change", incarcaSaliDisponibile);
document.getElementById("durata").addEventListener("input", incarcaSaliDisponibile);
</script>
</body>

</html>
