<!-- templates/secretariat_examene_crud.html -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>CRUD Examene Programate</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        input[type="text"], input[type="number"], input[type="datetime-local"] {
            width: 150px;
        }
        .actiuni button {
            margin: 0 3px;
        }
    </style>
</head>
<body>
<h2>✏️ Examene Programate - Secretariat</h2>

<table id="tabelExamene">
    <thead>
        <tr>
            <th>ID</th>
            <th>ID Disciplina</th>
            <th>ID Sala</th>
            <th>Data</th>
            <th>Durata</th>
            <th>ID Asistent</th>
            <th>Acțiuni</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h3>➕ Adaugă Examen Nou</h3>
<form id="formNou">
    <label>ID Disciplina: <input type="number" name="id_disciplina" required></label>
    <label>ID Sala: <input type="number" name="id_sala" required></label>
    <label>Data: <input type="datetime-local" name="data" required></label>
    <label>Durata (minute): <input type="number" name="durata" required></label>
    <label>ID Asistent: <input type="number" name="id_asistent"></label>
    <button type="submit">Adaugă</button>
</form>

<script>
async function incarcaExamene() {
    const tbody = document.querySelector("#tabelExamene tbody");
    tbody.innerHTML = "<tr><td colspan='7'>⛳️ Se încarcă...</td></tr>";
    const r = await fetch("/api/examene-programate");
    const data = await r.json();
    tbody.innerHTML = "";

    data.forEach(ex => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${ex.id}</td>
            <td><input type="number" value="${ex.id_disciplina}" disabled></td>
            <td><input type="number" value="${ex.id_sala}" class="edit-id_sala"></td>
            <td><input type="datetime-local" value="${ex.data.replace(' ', 'T')}" class="edit-data"></td>
            <td><input type="number" value="${ex.durata}" class="edit-durata"></td>
            <td><input type="number" value="${ex.id_asistent || ''}" class="edit-id_asistent"></td>
            <td class="actiuni">
                <button onclick="salveaza(${ex.id}, this)">✅ Salvează</button>
                <button onclick="sterge(${ex.id})">❌ Șterge</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

async function salveaza(id, btn) {
    const row = btn.closest("tr");
    const payload = {
        id_sala: row.querySelector(".edit-id_sala").value,
        data: row.querySelector(".edit-data").value,
        durata: row.querySelector(".edit-durata").value,
        id_asistent: row.querySelector(".edit-id_asistent").value || null
    };

    const r = await fetch(`/api/examene-programate/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    if (r.ok) {
        alert("Examen actualizat cu succes.");
        incarcaExamene();
    } else {
        alert("Eroare la actualizare.");
    }
}

async function sterge(id) {
    if (!confirm("Sigur vrei să ștergi acest examen?")) return;
    const r = await fetch(`/api/examene-programate/${id}`, { method: "DELETE" });
    if (r.ok) {
        alert("Examen șters.");
        incarcaExamene();
    } else {
        alert("Eroare la ștergere.");
    }
}

document.getElementById("formNou").addEventListener("submit", async function(e) {
    e.preventDefault();
    const form = e.target;
    const payload = Object.fromEntries(new FormData(form).entries());
    const r = await fetch("/api/examene-programate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    if (r.ok) {
        alert("Examen adăugat cu succes.");
        form.reset();
        incarcaExamene();
    } else {
        alert("Eroare la adăugare.");
    }
});

window.onload = incarcaExamene;
</script>
</body>
</html>
