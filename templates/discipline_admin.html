<h2>Administrare discipline</h2>

<!-- Formular Adăugare -->
<form method="post" action="/secretariat/discipline/add">
    <input name="topic" placeholder="Nume disciplină" required>
    <select name="id_cadru" required>
        {% for c in cadre %}
            <option value="{{ c.id }}">{{ c.firstName }} {{ c.lastName }}</option>
        {% endfor %}
    </select>
    <select name="id_subgrupa" required>
        {% for s in subgrupe %}
            <option value="{{ s.id }}">{{ s.groupName }}{{ s.subgroupIndex }}</option>
        {% endfor %}
    </select>
    <button type="submit">➕ Adaugă</button>
</form>

<hr>

<!-- Tabel -->
<table border="1">
    <tr>
        <th>ID</th>
        <th>Topic</th>
        <th>Cadru</th>
        <th>Subgrupă</th>
        <th>Acțiuni</th>
    </tr>
    {% for d in discipline %}
    <tr>
        <form method="post" action="/secretariat/discipline/update/{{ d.id }}">
            <td>{{ d.id }}</td>
            <td><input name="topic" value="{{ d.topic }}"></td>
            <td>
                <select name="id_cadru">
                    {% for c in cadre %}
                        <option value="{{ c.id }}" {% if d.id_cadru == c.id %}selected{% endif %}>
                            {{ c.firstName }} {{ c.lastName }}
                        </option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <select name="id_subgrupa">
                    {% for s in subgrupe %}
                        <option value="{{ s.id }}" {% if d.id_subgrupa == s.id %}selected{% endif %}>
                            {{ s.groupName }}{{ s.subgroupIndex }}
                        </option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <button type="submit">💾</button>
                <a href="/secretariat/discipline/delete/{{ d.id }}" onclick="return confirm('Sigur ștergi?')">🗑️</a>
            </td>
        </form>
    </tr>
    {% endfor %}
</table>
<div style="margin-top: 20px;">
    <b>Pagina:</b>
    {% for p in range(1, pagini_totale + 1) %}
        {% if p == pagina_curenta %}
            <strong>{{ p }}</strong>
        {% else %}
            <a href="/secretariat/discipline-admin?page={{ p }}">{{ p }}</a>
        {% endif %}
    {% endfor %}
</div>
