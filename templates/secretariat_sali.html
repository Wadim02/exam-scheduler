<!-- templates/secretariat_sali.html -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Săli - Secretariat</title>
</head>
<body>
    <h1>Gestionare Săli</h1>

    <!-- Buton Descărcare + Convertire -->
    <button onclick="descarcaSali()">📥 Descarcă și convertește sălile</button>
    <ul id="mesaje"></ul>

    <script>
        async function descarcaSali() {
            const lista = document.getElementById("mesaje");
            lista.innerHTML = "<li>⏳ Pornim procesul...</li>";

            try {
                const r = await fetch("/secretariat/download-sali-status");
                if (!r.ok) throw new Error("Eșec la descărcare");

                const rezultat = await r.json();

                rezultat.mesaje.forEach(msg => {
                    const li = document.createElement("li");
                    li.textContent = msg;
                    lista.appendChild(li);
                });

                // Descărcare automată a fișierului sali.xlsx
                const a = document.createElement("a");
                a.href = rezultat.download_url;
                a.download = "sali.xlsx";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (err) {
                const li = document.createElement("li");
                li.style.color = "red";
                li.textContent = "❌ " + err.message;
                lista.appendChild(li);
            }
        }
    </script>

    <br><br>
<form onsubmit="return importSali();">
    <button type="submit">📂 Importă sălile în baza de date</button>
</form>
<div id="statusImport"></div>

<script>
async function importSali() {
    event.preventDefault();

    const statusDiv = document.getElementById("statusImport");
    statusDiv.innerText = "⏳ Se importă sălile...";

    try {
        const resp = await fetch("/secretariat/import-sali-csv", { method: "POST" });
        const data = await resp.json();

        if (resp.ok) {
            statusDiv.innerText = "✔ Import reușit: " + data.importate + " săli";
        } else {
            statusDiv.innerText = "❌ Eroare: " + data.detail;
        }
    } catch (err) {
        statusDiv.innerText = "❌ Eroare generală: " + err.message;
    }

    return false;
}
</script>
<br><br>
 <a href="/secretariat/sali">
    <button>👁️ Vizualizează și editează sălile</button>
</a> 
<br><br>
<h2>📥 Încarcă fișier Excel cu șefi de grupă</h2>
<form id="import-form">
    <label>Selectează fișierul Excel (.xlsx):</label>
    <input type="file" id="excel-file" accept=".xlsx" required>
    <button type="submit">📤 Trimite</button>
</form>
<div id="upload-status"></div>

<script>
document.getElementById("import-form").addEventListener("submit", async function(event) {
    event.preventDefault();

    const fileInput = document.getElementById("excel-file");
    const statusDiv = document.getElementById("upload-status");
    statusDiv.innerHTML = "⏳ Se încarcă fișierul...";

    const formData = new FormData();
    formData.append("excel_file", fileInput.files[0]);

    try {
        const response = await fetch("/secretariat/sefgrupe/import", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            statusDiv.innerHTML = "<span style='color:green'>✅ " + data.message + "</span>";
        } else {
            statusDiv.innerHTML = "<span style='color:red'>❌ " + data.detail + "</span>";
        }
    } catch (error) {
        statusDiv.innerHTML = "<span style='color:red'>❌ Eroare la trimitere: " + error.message + "</span>";
    }
});
</script> 
<br><br>
<a href="/secretariat/sefgrupe">
    <button type="button">📝 Editează șefii de grupă</button>
</a>
<br><br>
<button onclick="genereazaDisciplineSimplu()">⚙️ Generează discipline</button>
<div id="statusSimplu"></div>
<button onclick="importaDiscipline()">📂 Importă disciplinele în baza de date</button>
<div id="statusImportDiscipline"></div>
<script>
async function importaDiscipline() {
    const status = document.getElementById("statusImportDiscipline");
    status.innerText = "⏳ Se importă disciplinele...";

    try {
        const resp = await fetch("/secretariat/import-discipline-csv", { method: "POST" });
        const data = await resp.json();

        if (resp.ok) {
            status.innerText = "✅ " + data.message;
        } else {
            status.innerText = "❌ " + data.detail;
        }
    } catch (err) {
        status.innerText = "❌ Eroare de rețea: " + err.message;
    }
}
</script>
<button onclick="location.href='/secretariat/discipline-admin'" style="margin-top: 20px;">
    Administrează disciplinele
</button>
<script>
async function genereazaDisciplineSimplu() {
    const status = document.getElementById("statusSimplu");
    status.innerText = "⏳ Generare în curs...";

    try {
        const r = await fetch("/secretariat/discipline/genereaza", { method: "POST" });
        const rezultat = await r.json();

        if (r.ok) {
            status.innerHTML = `✅ ${rezultat.message}<br><a href="/${rezultat.csv}" download>📥 Descarcă CSV</a>`;
        } else {
            status.innerText = "❌ Eroare: " + rezultat.detail;
        }
    } catch (err) {
        status.innerText = "❌ Eroare de rețea: " + err.message;
    }
}
</script>
<hr>
<a href="/secretariat/status">
    <button>📋 Situație completare examene</button>
</a>
